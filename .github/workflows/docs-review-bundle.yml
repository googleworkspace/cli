name: Docs Review Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-review-bundle:
    name: Docs Review Bundle (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docs-review-bundle-${{ matrix.os }}
      - name: Build CLI for export contract regression
        run: cargo build --locked
      - name: Test stdlib companion with synthetic fixtures
        run: python3 -B -m unittest discover -s examples/docs-review-bundle -p 'test_*.py' -v
        env:
          GWS_TEST_BINARY: ${{ github.workspace }}/target/debug/gws
