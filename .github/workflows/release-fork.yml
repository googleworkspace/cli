name: Release

on:
  push:
    tags:
      - 'fork/v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. fork/v0.22.5-mcp.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "true"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: macos-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows-amd64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set asset filename
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#fork/v}"
          echo "ASSET=gws-mcp-${VERSION}-${{ matrix.asset_name }}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        continue-on-error: true

      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          if sccache --start-server 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache server failed to start, building without cache"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}
          cache-targets: "false"

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Disable Windows Defender scanning for cargo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ env.ASSET }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" gws
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ env.ASSET }}.tar.gz" > "${{ env.ASSET }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ env.ASSET }}.tar.gz" > "${{ env.ASSET }}.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/gws.exe" `
            -DestinationPath "${{ env.ASSET }}.zip"
          $hash = (Get-FileHash "${{ env.ASSET }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ env.ASSET }}.zip" | Out-File -Encoding ASCII "${{ env.ASSET }}.zip.sha256"

      - name: Generate .deb
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb@3.7.0
          cargo deb --no-build --no-strip --target ${{ matrix.target }} \
            -p google-workspace-cli
          DEB=$(ls target/${{ matrix.target }}/debian/*.deb)
          cp "$DEB" "${{ env.ASSET }}.deb"
          sha256sum "${{ env.ASSET }}.deb" > "${{ env.ASSET }}.deb.sha256"

      - name: Generate .rpm
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm@0.21.0
          cargo generate-rpm --target ${{ matrix.target }} \
            -p crates/google-workspace-cli
          RPM=$(ls target/${{ matrix.target }}/generate-rpm/*.rpm)
          cp "$RPM" "${{ env.ASSET }}.rpm"
          sha256sum "${{ env.ASSET }}.rpm" > "${{ env.ASSET }}.rpm.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.*
          retention-days: 1

  release:
    name: Create Release and Update Formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#fork/v}"
          cat > /tmp/release-notes.md << 'RELNOTES'
          ## Changes

          See [FORK.md](https://github.com/shigechika/gws-mcp/blob/main/FORK.md) for fork-specific changes.

          ## Install

          ### Homebrew (macOS / Linux)
          ```bash
          brew install shigechika/tap/gws-mcp
          ```

          ### Debian / Ubuntu (.deb)
          ```bash
          sudo dpkg -i gws-mcp-VERSION-linux-amd64.deb
          # or for arm64:
          sudo dpkg -i gws-mcp-VERSION-linux-arm64.deb
          ```

          ### RHEL / Fedora / Amazon Linux (.rpm)
          ```bash
          sudo rpm -i gws-mcp-VERSION-linux-amd64.rpm
          # or for aarch64:
          sudo rpm -i gws-mcp-VERSION-linux-arm64.rpm
          ```

          ### Windows
          Download `gws-mcp-VERSION-windows-amd64.zip`, extract `gws.exe`, and place it in a directory on your PATH.

          ### Cargo
          ```bash
          cargo install --git https://github.com/shigechika/gws-mcp --locked
          ```

          ### Direct download (macOS / Linux)
          Download the `.tar.gz` archive for your platform below and place `gws` in your PATH.
          RELNOTES
          # Replace VERSION placeholder with actual version
          sed -i "s/VERSION/${VERSION}/g" /tmp/release-notes.md
          gh release create "$TAG" \
            --title "fork/v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            gws-mcp-*

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          [[ -z "$GH_TOKEN" ]] && echo "HOMEBREW_TAP_TOKEN not set, skipping formula update" && exit 0
          VERSION="${TAG#fork/v}"
          TAG_ENCODED="${TAG/\//%2F}"
          BASE_URL="https://github.com/shigechika/gws-mcp/releases/download/${TAG_ENCODED}"

          SHA_ARM64_DARWIN=$(awk '{print $1}' "gws-mcp-${VERSION}-macos-arm64.tar.gz.sha256")
          SHA_X86_64_DARWIN=$(awk '{print $1}' "gws-mcp-${VERSION}-macos-amd64.tar.gz.sha256")
          SHA_X86_64_LINUX=$(awk '{print $1}' "gws-mcp-${VERSION}-linux-amd64.tar.gz.sha256")
          SHA_ARM64_LINUX=$(awk '{print $1}' "gws-mcp-${VERSION}-linux-arm64.tar.gz.sha256")

          cat > /tmp/gws-mcp.rb << FORMULA
          class GwsMcp < Formula
            desc "Google Workspace CLI with MCP server support"
            homepage "https://github.com/shigechika/gws-mcp"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "${BASE_URL}/gws-mcp-${VERSION}-macos-arm64.tar.gz"
                sha256 "${SHA_ARM64_DARWIN}"
              end
              on_intel do
                url "${BASE_URL}/gws-mcp-${VERSION}-macos-amd64.tar.gz"
                sha256 "${SHA_X86_64_DARWIN}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/gws-mcp-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA_ARM64_LINUX}"
              end
              on_intel do
                url "${BASE_URL}/gws-mcp-${VERSION}-linux-amd64.tar.gz"
                sha256 "${SHA_X86_64_LINUX}"
              end
            end

            def install
              bin.install "gws"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/gws --version")
            end
          end
          FORMULA

          # Commit to homebrew-tap
          gh api repos/shigechika/homebrew-tap/contents/Formula/gws-mcp.rb \
            --method PUT \
            --field message="update: gws-mcp formula to ${VERSION}" \
            --field content="$(base64 -w0 /tmp/gws-mcp.rb)" \
            --field sha="$(gh api repos/shigechika/homebrew-tap/contents/Formula/gws-mcp.rb --jq '.sha' 2>/dev/null || echo '')" \
            2>/dev/null || \
          gh api repos/shigechika/homebrew-tap/contents/Formula/gws-mcp.rb \
            --method PUT \
            --field message="add: gws-mcp formula ${VERSION}" \
            --field content="$(base64 -w0 /tmp/gws-mcp.rb)"
