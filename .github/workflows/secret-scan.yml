name: Secret Scanning

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 3 * * *"  # nightly full scan

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: magnon-enterprise-runners
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          install -d -m 700 "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 700 "$install_dir/gitleaks"
          "$install_dir/gitleaks" version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run Gitleaks OSS on pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Run Gitleaks OSS on pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          if [[ "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            log_opts="origin/${DEFAULT_BRANCH}..${HEAD_SHA}"
          else
            log_opts="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="$log_opts" .

      - name: Run Gitleaks OSS on the scheduled current tree
        if: github.event_name == 'schedule'
        run: gitleaks dir --redact --no-banner --exit-code 1 .
  trufflehog:
    name: TruffleHog
    runs-on: magnon-enterprise-runners
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0

      # TruffleHog needs a DIFFERENT base/head per event. A single
      # `base: default_branch, head: HEAD` fails on a push to the default
      # branch with "BASE and HEAD commits are the same. TruffleHog won't scan
      # anything." -- which is why Secret Scanning stayed red on main even
      # after the action SHA was repinned.
      - name: TruffleHog OSS on pull-request commits
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

      # `github.event.before` is all zeros for a newly pushed branch, in which
      # case there is no meaningful diff base -- fall back to a full scan.
      - name: TruffleHog OSS on pushed commits
        if: github.event_name == 'push' && !startsWith(github.event.before, '0000000')
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: TruffleHog OSS full scan
        if: github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.event.before, '0000000'))
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          path: ./
          extra_args: --debug --only-verified
